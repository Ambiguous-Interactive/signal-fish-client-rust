# Provenance for the vendored Signal Fish server AsyncAPI protocol spec.
#
# Refresh procedure: see .llm/skills/protocol-wire-conformance/SKILL.md
# Update this file IN THE SAME COMMIT as any change to the vendored spec.

[upstream]
repo = "https://github.com/Ambiguous-Interactive/signal-fish-server"
path = "spec"
# Exact server commit the spec bytes were copied from.
# 2026-09-11 refresh: upstream descriptive-only prose (server PRs #563/#565/#567,
# issues #396/#561/#566) reworded the kick/ban/PlayerKicked descriptions
# (a pending reconnection record is tombstoned instead of a seat removed; the
# 4007 `kicked` close is withheld when the target is live in another room) and
# documented that RegenerateRoomCode's result goes only to the acting
# authority, so a post-rotation TransferAuthority needs the new code shared
# out of band. Zero schema-shape, token, or sample changes; all four wire
# samples are byte-identical at the new pin. The Server 0.8.0
# release pin
# (d79dcdc7549777c8c2bd9fcb2d132641532d8c86) does not declare the
# access-control surface, so the released runtime compatibility binding stays
# at that release. This evidence authority advances together with
# tests/compatibility.toml's [protocol_authority] and the wire-samples
# PROVENANCE.
commit = "ac118f846f26ac55e2fc1f3231dcc9aec86a7275"
# ISO 8601 date of the last refresh.
synced = "2026-09-11"

# SHA-256 of each vendored file. A policy test recomputes these, so the spec
