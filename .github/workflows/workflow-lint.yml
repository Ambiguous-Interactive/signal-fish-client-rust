# Workflow lint and hygiene checks for signal-fish-client
#
# Runs on every push to main and on all pull requests so its stable aggregate
# gate reports on every protected-branch candidate.
# Jobs: actionlint — workflow syntax, yamllint — YAML style, shellcheck — shell scripts,
#        python-tooling — repository Python guards, devcontainer-compat — cross-platform validation
#
# Cancel in-progress runs on the same branch to save resources.

name: Workflow Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # actionlint — validate GitHub Actions workflow syntax and semantics
  # ──────────────────────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download checksum-verified actionlint binary
        env:
          # Pinned version + digest — bump manually; go-module installs are
          # not covered by Dependabot, and a release binary skips the ~1 min
          # compile-from-source of the previous `go install` step.
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --output "${asset}" "${base}/${asset}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${asset}" | sha256sum --check
          tar -xzf "${asset}" actionlint
          install -m 0755 actionlint "${HOME}/.local/bin/actionlint"
          "${HOME}/.local/bin/actionlint" --version | grep -Fx "${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: '"${HOME}/.local/bin/actionlint" -color'

  # ──────────────────────────────────────────────────────────────
  # yamllint — validate YAML style and syntax of workflow files
  # ──────────────────────────────────────────────────────────────
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install 'yamllint>=1.35,<2'

      - name: Run yamllint
        run: yamllint --strict .github/workflows/ .github/dependabot.yml .yamllint.yml

  # ──────────────────────────────────────────────────────────────
  # shellcheck — lint shell scripts in scripts/ directory
  # ──────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck scripts/*.sh .devcontainer/scripts/*.sh

      - name: Run test I/O unwrap checker unit tests
        run: bash scripts/test_check_test_io_unwrap.sh

      - name: Run test quality checker unit tests
        run: bash scripts/test_check_test_quality.sh

      - name: Run target-gated doc-link checker unit tests
        run: bash scripts/test_check_target_gated_doc_links.sh

      - name: Run shell portability checker unit tests
        run: bash scripts/test_shell_portability.sh

  # ──────────────────────────────────────────────────────────────
  # python-tooling — run every repository Python guard and self-test
  # ──────────────────────────────────────────────────────────────
  python-tooling:
    name: Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python3 -m pip install 'pytest==9.1.1'

      - name: Validate Agent Skills and generated index
        run: |
          python3 scripts/pre-commit-llm.py
          git diff --exit-code HEAD --

      - name: Test Agent Skills validation
        run: python3 -m pytest -q scripts/test_pre_commit_llm.py

      - name: Test repository Python tooling
        run: >-
          python3 -m unittest
          scripts/test_release.py
          scripts/test_required_checks.py
          scripts/test_audit_repository_rules.py
          scripts/test_check_devcontainer_agents.py

      - name: Test admonition validation
        run: python3 scripts/test_check_admonitions.py

  # ──────────────────────────────────────────────────────────────
  # devcontainer-compat — validate cross-platform devcontainer behavior
  # ──────────────────────────────────────────────────────────────
  devcontainer-compat:
    name: Devcontainer compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate devcontainer cross-platform compatibility
        run: bash scripts/check-devcontainer-compat.sh

      - name: Run devcontainer compat unit tests
        run: bash scripts/test_check_devcontainer_compat.sh

      - name: Check devcontainer Dockerfile
        run: docker buildx build --check -f .devcontainer/Dockerfile .

  required:
    name: Workflow Lint Required
    if: ${{ always() }}
    needs: [actionlint, yamllint, shellcheck, python-tooling, devcontainer-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every workflow lint job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
          if [ -n "$failures" ]; then
            printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
            exit 1
          fi
