# CI pipeline for signal-fish-client
#
# Runs on every push to main and on all pull requests.
# Jobs: fmt → clippy, test, msrv, doc, deny → publish-dry-run
#
# Cancel in-progress runs on the same branch to save resources.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_RUST: "1.96.1"
  # Deny warnings in CI for doc builds
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Formatting — fastest check, runs first
  # ──────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ──────────────────────────────────────────────────────────────
  # Spell check — typos scans the WHOLE repository (Rust source,
  # TOML, YAML, Markdown, …), so it lives here in the always-on CI
  # rather than the path-filtered docs-validation workflow. That
  # guarantees it runs on every change, including Rust-only PRs.
  # Standalone and fast (~seconds): no Rust toolchain, no `needs`.
  # ──────────────────────────────────────────────────────────────
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run typos spell checker
        uses: crate-ci/typos@v1.50.0
        with:
          config: .typos.toml

  # ──────────────────────────────────────────────────────────────
  # Clippy — lint check across feature combinations
  # ──────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            scope: "--workspace"
            flags: ""
          - name: all-features
            scope: "--workspace"
            flags: "--all-features"
          # Sparse cells scope to the core package: `--workspace` would pull
          # in the Godot adapter, whose dependency edge force-enables the
          # core `polling-client` feature and silently unifies every isolated
          # state the cell names.
          - name: token-binding-no-tls
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features token-binding"
          - name: no-default-features
            scope: "-p signal-fish-client"
            flags: "--no-default-features"
          - name: polling-client-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features polling-client"
          - name: mesh-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features mesh"
          - name: polling-client-mesh
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features polling-client,mesh"
          - name: tokio-runtime-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features tokio-runtime"
          - name: tls-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features tls"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run Clippy
        run: cargo clippy ${{ matrix.scope }} --all-targets ${{ matrix.flags }} --locked -- -D warnings

  # ──────────────────────────────────────────────────────────────
  # Tests — run across feature combinations
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            scope: "--workspace"
            flags: ""
          - name: all-features
            scope: "--workspace"
            flags: "--all-features"
          # Sparse cells scope to the core package: `--workspace` would pull
          # in the Godot adapter, whose dependency edge force-enables the
          # core `polling-client` feature and silently unifies every isolated
          # state the cell names.
          - name: token-binding-no-tls
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features token-binding"
          - name: no-default-features
            scope: "-p signal-fish-client"
            flags: "--no-default-features"
          - name: polling-client-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features polling-client"
          - name: mesh-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features mesh"
          - name: polling-client-mesh
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features polling-client,mesh"
          - name: tokio-runtime-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features tokio-runtime"
          - name: tls-only
            scope: "-p signal-fish-client"
            flags: "--no-default-features --features tls"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run tests
        run: cargo test ${{ matrix.scope }} ${{ matrix.flags }} --locked

  # ──────────────────────────────────────────────────────────────
  # Pinned server compatibility E2E — generation-less 0.4, Server 0.7 mesh,
  # reconnect and liveness behavior, and required token-binding security cases.
  # ──────────────────────────────────────────────────────────────
  server-mesh-e2e:
    name: Server compatibility E2E (${{ matrix.server_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_generation_signal_and_host_replan
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_rkyv_request_resolves_to_json
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_reconnect_after_disconnect_uses_server_token
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_slow_consumer_eviction_is_observable
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_sender_ping_survives_own_game_data_flood
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_required_token_binding_wss
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_rejects_invalid_token_binding_proofs
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_required_client_fingerprint_token_binding_wss
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_require_client_fingerprint_option_rejects_fingerprint_less_signer
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_polling_client_fingerprint_token_binding_wss
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_rejects_invalid_client_fingerprint_proofs
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_going_away_close_4000
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_spectator_live_smoke
          - server_version: "0.7.0"
            server_sha256: "70c6d12ac77843038c96d374a91225825c685cbf65fd7bedfd26b08d4003af7e"
            test_name: e2e_server_070_authority_handoff_and_latest_delivery
          - server_version: "0.4.0"
            server_sha256: "971410b9503dd2f0c9f69c8a0a97e043e3979c79bf3d305e2ad03e21da8584e9"
            test_name: e2e_server_040_generationless_mesh_signal
    env:
      SERVER_VERSION: ${{ matrix.server_version }}
      SERVER_SHA256: ${{ matrix.server_sha256 }}
      SERVER_TEST: ${{ matrix.test_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Download pinned Signal Fish server
        run: |
          set -euo pipefail
          asset="signal-fish-server-v${SERVER_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/Ambiguous-Interactive/signal-fish-server/releases/download/v${SERVER_VERSION}"
          curl --fail --location --retry 5 --output "${asset}" "${base}/${asset}"
          printf '%s  %s\n' "${SERVER_SHA256}" "${asset}" | sha256sum --check
          mkdir -p .signal-fish-server
          tar -xzf "${asset}" -C .signal-fish-server
      - name: Run pinned server compatibility E2E
        run: |
          set -euo pipefail
          server_bin="$(find .signal-fish-server -type f -name signal-fish-server -print -quit)"
          chmod +x "${server_bin}"
          listed_tests="$(
            cargo test --all-features --test real_server_e2e \
              "${SERVER_TEST}" \
              -- --ignored --exact --list
          )"
          matching_tests="$(
            printf '%s\n' "${listed_tests}" | grep -Fxc "${SERVER_TEST}: test" || true
          )"
          if [ "${matching_tests}" -ne 1 ]; then
            printf 'Expected exactly one ignored test named %s, libtest listed:\n%s\n' \
              "${SERVER_TEST}" "${listed_tests}" >&2
            exit 1
          fi
          SIGNAL_FISH_SERVER_BIN="${PWD}/${server_bin}" \
            cargo test --all-features --test real_server_e2e \
              "${SERVER_TEST}" \
              -- --ignored --exact --test-threads=1

  # ──────────────────────────────────────────────────────────────
  # MSRV — verify minimum supported Rust version (1.87.0)
  # ──────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.87.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
      - name: Install packaging Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Compile repository core tests with MSRV
        run: cargo +1.87.0 test --locked --package signal-fish-client --all-features --no-run
      - name: Test repository core library with MSRV
        run: cargo +1.87.0 test --locked --package signal-fish-client --all-features --lib
      - name: Create isolated core package tree
        run: |
          core_dir="$RUNNER_TEMP/signal-fish-core-msrv"
          core_version=$(python3 scripts/release.py package-version)
          mkdir -p "$core_dir"
          cargo +1.96.1 package --locked --package signal-fish-client --no-verify
          tar -xzf "target/package/signal-fish-client-${core_version}.crate" \
            --strip-components=1 -C "$core_dir"
      - name: Verify isolated core metadata has no Godot packages
        run: |
          cargo +1.87.0 metadata --locked --format-version 1 \
            --manifest-path "$RUNNER_TEMP/signal-fish-core-msrv/Cargo.toml" \
            > "$RUNNER_TEMP/core-metadata.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert all(not p["name"].startswith("godot") for p in data["packages"])' \
            "$RUNNER_TEMP/core-metadata.json"
      - name: Compile isolated core tests with MSRV
        run: cargo +1.87.0 test --locked --manifest-path "$RUNNER_TEMP/signal-fish-core-msrv/Cargo.toml" --all-features --no-run
      - name: Test isolated core library with MSRV
        run: cargo +1.87.0 test --locked --manifest-path "$RUNNER_TEMP/signal-fish-core-msrv/Cargo.toml" --all-features --lib

  # ──────────────────────────────────────────────────────────────
  # Adapter MSRV — godot-rust 0.5 requires a newer compiler than core
  # ──────────────────────────────────────────────────────────────
  adapter-msrv:
    name: Godot adapter MSRV (1.94.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install adapter Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Test adapter with its MSRV
        run: cargo test --locked -p signal-fish-client-godot

  # ──────────────────────────────────────────────────────────────
  # Documentation — ensure docs build cleanly
  # ──────────────────────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Verify docs.rs compatibility
        run: bash scripts/check-docsrs.sh

  # ──────────────────────────────────────────────────────────────
  # cargo-deny — license and advisory audit
  # ──────────────────────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1

  # ──────────────────────────────────────────────────────────────
  # Deterministic ClientCore performance and allocation contract
  # ──────────────────────────────────────────────────────────────
  performance-contract:
    name: Performance contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned measurement toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Generate workspace lockfile
        run: bash scripts/cargo-retry.sh +"${RELEASE_RUST}" generate-lockfile
      - name: Verify deterministic workload ledgers
        run: cargo +"${RELEASE_RUST}" run --locked -p signal-fish-client-perf-lab --features perf --bin perf-smoke
      - name: Enforce debug allocation ceilings
        run: cargo +"${RELEASE_RUST}" run --locked -p signal-fish-client-perf-lab --features perf --bin perf-allocations -- --samples 10 > allocation-debug.json
      - name: Enforce release allocation ceilings
        run: cargo +"${RELEASE_RUST}" run --locked --release -p signal-fish-client-perf-lab --features perf --bin perf-allocations -- --samples 10 > allocation-release.json
      - name: Capture release timing diagnostics
        run: cargo +"${RELEASE_RUST}" run --locked --release -p signal-fish-client-perf-lab --features perf --bin perf-timing -- --samples 5 > timing-release.json
      - name: Upload measurement reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: client-core-performance-${{ github.sha }}
          path: |
            allocation-debug.json
            allocation-release.json
            timing-release.json
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────
  # Publish dry-run — verify crate packages correctly
  # Depends on tests and clippy passing first.
  # ──────────────────────────────────────────────────────────────
  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [clippy, test, msrv, adapter-msrv, doc, deny]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run publish dry-run
        run: |
          python3 scripts/release.py workspace-plan > "$RUNNER_TEMP/workspace-plan.json"
          mapfile -t packages < <(jq -r '.packages[].name' "$RUNNER_TEMP/workspace-plan.json")
          package_args=()
          for package in "${packages[@]}"; do
            package_args+=(-p "$package")
          done
          # --locked mirrors the Release workflow: dependency manifests that
          # drift from the tracked lock fail here instead of on release day.
          cargo +"${RELEASE_RUST}" publish --dry-run --locked "${package_args[@]}"

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [fmt, spell-check, clippy, test, server-mesh-e2e, msrv, adapter-msrv, doc, deny, performance-contract, publish-dry-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
          if [ -n "$failures" ]; then
            printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
            exit 1
          fi
