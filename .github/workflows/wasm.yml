# WebAssembly build checks for signal-fish-client
#
# Target: wasm32-unknown-unknown
#   This is the standard Rust target for browser/web WebAssembly. It is used by
#   wasm-bindgen, wasm-pack, and web-targeting game engines (Bevy, Godot HTML5,
#   Unity WebGL). The "unknown-unknown" triple means: no vendor, no OS — the
#   binary runs inside a browser or WASM runtime sandbox, not a traditional OS.
#   Cross-compiling for this target requires only `rustup target add
#   wasm32-unknown-unknown`; no special hardware is needed.
#
# Target: wasm32-unknown-emscripten
#   Used by Godot 4.5 web exports via gdext (godot-rust). Unlike
#   wasm32-unknown-unknown, this target compiles against the Emscripten C
#   runtime used by Godot web GDExtensions. Because
#   wasm32-unknown-emscripten is a Rust tier 3 target,
#   building requires:
#     - Nightly toolchain (tier 3 targets are not available on stable)
#     - `-Zbuild-std` flag (std must be built from source for this target)
#     - `rust-src` component (provides the std source code for -Zbuild-std)
#     - Emscripten SDK (provides the sysroot and system libraries)
#
# Feature flags:
#   `transport-websocket` is excluded because it depends on tokio-tungstenite
#   over TCP sockets, which are unavailable in the browser sandbox. Consumers
#   targeting WASM can supply their own transport implementation via the
#   Transport trait. Godot consumers use the `signal-fish-client-godot`
#   companion crate; the raw `transport-websocket-emscripten` feature is
#   retained for custom hosts that explicitly link Emscripten's optional
#   WebSocket library.

name: WASM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Build for WASM target
        run: cargo build --target wasm32-unknown-unknown --no-default-features --locked
      - name: Clippy check for WASM target
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings

  emscripten:
    name: Build (wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    # Three -Zbuild-std full-std builds plus the harness build: a cold cache
    # flirts with 30 minutes on hosted runners.
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy
      - name: Install Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          # Matched to the Godot 4.5 web export toolchain; the tier-3
          # wasm32-unknown-emscripten -Zbuild-std link flags are
          # emsdk-version-sensitive. Upgrade only after a green probe (issue #201).
          version: 3.1.74
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
      - name: Validate Emscripten FFI safety policy
        run: |
          bash scripts/test_check_ffi_safety.sh
          bash scripts/check-ffi-safety.sh
      - name: Build (no default features)
        run: >-
          cargo +nightly build -Zbuild-std
          --target wasm32-unknown-emscripten
          --no-default-features
          --locked
      - name: Build (emscripten transport)
        run: >-
          cargo +nightly build -Zbuild-std
          --target wasm32-unknown-emscripten
          --no-default-features
          --features transport-websocket-emscripten
          --locked
      - name: Clippy (emscripten transport)
        run: >-
          cargo +nightly clippy -Zbuild-std
          --target wasm32-unknown-emscripten
          --no-default-features
          --features transport-websocket-emscripten
          --locked
          -- -D warnings

      # On-target runtime coverage for the Emscripten transport (issues #194
      # and #212): the harness binary is linked against the transport and
      # executed under Node.js against a loopback RFC 6455 server, pinning
      # the send-after-close classification, ledger-bound fusion and
      # drain-credit release, close-metadata capture, the rejected-handshake
      # failure path, extended-length frames, abort, and close→delete cleanup
      # contracts that static lanes cannot execute.
      - name: Run on-target Emscripten transport harness
        env:
          RUSTFLAGS: >-
            -C panic=abort
            -C link-arg=-lwebsocket.js
            -C link-arg=-sALLOW_MEMORY_GROWTH=1
            -C link-arg=-sENVIRONMENT=node
            -C link-arg=-sEXIT_RUNTIME=0
            -C link-arg=-sWASM_ASYNC_COMPILATION=0
            -C link-arg=-sEXPORTED_FUNCTIONS=_main,_sfh_begin,_sfh_step,_sfh_finish,_sfh_fail_reason,_malloc,_free
            -C link-arg=-sEXPORTED_RUNTIME_METHODS=ccall,UTF8ToString
            -C llvm-args=-enable-emscripten-cxx-exceptions=0
        run: |
          cargo +nightly build -Zbuild-std=std,panic_abort \
            --manifest-path tests/emscripten-harness/Cargo.toml \
            --target-dir target \
            --target wasm32-unknown-emscripten \
            --no-default-features \
            --features signal-fish-client/transport-websocket-emscripten \
            --locked
          # A panic-free infinite spin inside one wasm ccall must fail this
          # step in two minutes instead of hanging to the job-level timeout.
          timeout 120 node tests/emscripten-harness/driver/run-harness.cjs \
            target/wasm32-unknown-emscripten/debug/signal-fish-emscripten-harness.js

  required:
    name: WASM Required
    if: ${{ always() }}
    needs: [wasm, emscripten]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every WASM job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
          if [ -n "$failures" ]; then
            printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
            exit 1
          fi
