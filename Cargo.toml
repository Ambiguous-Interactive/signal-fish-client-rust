[package]
name = "signal-fish-client"
version.workspace = true
publish = ["crates-io"]
edition = "2021"
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
description = "Framed-transport-agnostic Rust client for the Signal Fish multiplayer signaling protocol"
repository = "https://github.com/Ambiguous-Interactive/signal-fish-client-rust"
homepage = "https://Ambiguous-Interactive.github.io/signal-fish-client-rust/"
documentation = "https://docs.rs/signal-fish-client"
keywords = ["gamedev", "signaling", "multiplayer", "networking", "matchmaking"]
categories = ["game-engines", "network-programming"]
rust-version = "1.87.0"
readme = "README.md"
include = [
    "/src/**",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[features]
default = ["transport-websocket"]
transport-websocket = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "tokio-runtime",
]
# Native WebSocket token-binding-v2 support. Kept opt-in so ordinary/default
# connections retain both their handshake and lightweight dependency graph.
token-binding = [
    "transport-websocket",
    "dep:base64",
    "dep:hkdf",
    "dep:hmac",
    "dep:sha2",
    "dep:zeroize",
]
# Optional TLS (wss://) for the built-in WebSocket transport: rustls with the
# ring crypto provider and bundled Mozilla webpki roots. Opt-in so the default
# build stays free of the heavier TLS/crypto dependency tree.
tls = [
    "transport-websocket",
    "dep:rustls",
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
# Requires --target wasm32-unknown-emscripten; compile_error!() fires on other targets.
transport-websocket-emscripten = ["polling-client"]
polling-client = []
tokio-runtime = ["tokio/rt", "tokio/time"]
# Protocol v3 mesh orchestration helpers (MeshSession tracker + WebRtcDriver seam).
# Pure-std, zero extra dependencies.
mesh = []

[dependencies]
# Async
# 1.21 is the true minimum: Sender::max_capacity() (1.21) and
# Sender::capacity() (1.5) back send_capacity()/max_send_capacity()
# and the SendBufferFull capacity report.
tokio = { version = "1.21", features = ["sync", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rmp = "0.8"
rmp-serde = "1.3"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Optional Signal Fish token-binding-v2 primitives.
base64 = { version = "0.22", optional = true }
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
zeroize = { version = "1.8", optional = true }

# Optional: WebSocket transport
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
# Optional: rustls with the ring crypto provider for the `tls` feature. We call
# `ring::default_provider().install_default()` in `connect_with_options` so the
# wss:// path always has a provider — even when the dependency graph also pulls
# rustls' aws_lc_rs provider, whose auto-detection otherwise panics on ambiguity.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "serde", "js"] }

[dev-dependencies]
tokio = { version = "1.21", features = ["full", "test-util"] }
futures-util = "0.3"
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.0"
# Used by the wire-sample provenance policy test to verify checksums.
sha2 = "0.11"
# Generates and shrinks polling-driver scheduler transition sequences.
proptest = "1.7"
# Parses production sources in the offline sole-unsafe-exception policy test.
proc-macro2 = "1"
syn = { version = "3", features = ["full", "visit"] }

[[example]]
name = "basic_lobby"
required-features = ["transport-websocket"]

[[example]]
name = "custom_transport"
required-features = ["tokio-runtime"]

[[example]]
name = "mesh_session"
required-features = ["mesh", "tokio-runtime"]

[[example]]
name = "load_lab"
required-features = ["transport-websocket"]

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Promoted from the 2026-08 runtime-invariant sweep: raw integer arithmetic
# must be `checked_`/`saturating_`/`wrapping_`-explicit or carry a scoped,
# documented proof, so debug/release overflow semantics cannot diverge
# silently on hostile input. Zero unguarded findings at promotion.
arithmetic_side_effects = "deny"
# Stable restriction lints promoted from the 2026-08 deep-safety evaluation:
# zero pre-existing findings across the workspace; each enforces an existing
# written policy (no debug leftovers, no process exit from a library, no
# `mem::forget` bypassing zeroization, and documented unsafe at the sole
# Emscripten FFI exception).
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rust]
# Production Rust is safe by default. The Emscripten transport has the only
# narrowly scoped exception because it binds the platform C WebSocket API.
unsafe_code = "deny"

[workspace]
members = ["crates/signal-fish-client-godot", "tools/perf-lab"]
resolver = "2"

[workspace.package]
version = "0.10.0"

[workspace.dependencies]
signal-fish-client = { version = "=0.10.0", path = ".", default-features = false }

# Release builds validate under the same arithmetic semantics as every debug
# test, fuzz, and Miri run: integer overflow aborts loudly instead of wrapping
# silently. Bench profiles inherit this through `release`.
[profile.release]
overflow-checks = true
