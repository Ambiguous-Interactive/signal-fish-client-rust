site_name: Signal Fish Client SDK
site_description: "Connect Rust and Godot games to the Signal Fish multiplayer signaling service"
site_url: https://Ambiguous-Interactive.github.io/signal-fish-client-rust/
repo_url: https://github.com/Ambiguous-Interactive/signal-fish-client-rust
repo_name: signal-fish-client-rust
edit_uri: edit/main/docs/
copyright: © 2026 Ambiguous Interactive

hooks:
  - hooks/rustdoc_codeblocks.py
  - hooks/llms_txt.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - header.autohide
  icon:
    repo: fontawesome/brands/github
  font: false

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
      check_paths: true
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Ambiguous-Interactive
      repo: signal-fish-client-rust

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ambiguous-Interactive/signal-fish-client-rust
    - icon: fontawesome/solid/cube
      link: https://crates.io/crates/signal-fish-client
    - icon: fontawesome/solid/book
      link: https://docs.rs/signal-fish-client
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/accessibility.js

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Start Here:
      - Installation & Quick Start: getting-started.md
      - Basic Lobby Walkthrough: examples.md
  - Use the SDK:
      - Client Commands & State: client.md
      - Events: events.md
      - Errors: errors.md
      - Deterministic Testing: testing.md
      - WebAssembly & Godot: wasm.md
      - Godot + Fortress: fortress.md
  - Multiplayer Choices:
      - Core Concepts: concepts.md
      - Protocol Versioning: protocol-versioning.md
      - Delivery Contract & Backpressure: delivery.md
      - Mesh (v3): mesh-guide.md
  - Advanced Reference:
      - Custom Transports: transport.md
      - Protocol Types: protocol.md
      - WebSocket Token Binding: token-binding.md
      - Migrating 0.7 to 0.8: migration-0.8.md
      - Migrating 0.8 to 0.9: migration-0.9.md
      - Migrating 0.10 to 0.11: migration-0.11.md
      - Release Operations: releasing.md
      - Brand & Font Attribution: attributions.md
