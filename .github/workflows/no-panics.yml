# Panic-free policy enforcement.
#
# Runs on every PR and push to main. Uses the guard script to scan for
# forbidden panic-prone patterns in all workspace member sources. (The
# deny-level Clippy lints run in ci.yml's clippy job; this grep gate adds
# coverage for paths Clippy does not compile, such as Emscripten-gated
# code on host runners.)
#
# Jobs:
#   panic-free-policy — grep-based panic-pattern scan across all members

name: No Panics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  panic-free-policy:
    name: Panic-free policy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run panic-free policy check
        run: bash scripts/check-no-panics.sh

  required:
    name: No Panics Required
    if: ${{ always() }}
    needs: [panic-free-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require panic-free policy
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
          if [ -n "$failures" ]; then
            printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
            exit 1
          fi
