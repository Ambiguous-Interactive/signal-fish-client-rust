# Provenance for the vendored Signal Fish server protocol wire samples.
#
# Refresh procedure: see .llm/skills/protocol-wire-conformance/SKILL.md
# Update this file IN THE SAME COMMIT as any change to the *.jsonl files.

[upstream]
repo = "https://github.com/Ambiguous-Interactive/signal-fish-server"
path = ".llm/code-samples/protocol"
# Exact server commit the .jsonl bytes were copied from. The bytes are
# byte-identical from the Server 0.8.0 release pin (d79dcdc7549777c8c2bd9fcb2d132641532d8c86)
# through the 2026-09-08 refresh: upstream's room access-control tier (server
# PR #545) added no wire samples — the four files are unchanged from the
# 2026-09-07 moderation-surface refresh, so the pre-existing lines stay
# byte-identical to the release pin. The 0.8.0 release never declared the
# moderation or access-control surfaces, so the released runtime
# compatibility binding stays at that release; the evidence authority
# advances together across compatibility.toml and both PROVENANCE files.
# (The 2026-09-08 b602fc1d follow-up is spec-prose only; the samples are
# unchanged there too. The 2026-09-12 refresh at a6cbbf69 (upstream PR #575,
# the ratified cloud-auth wire contract) added the optional
# `Authenticate.connect_token` field and the CONNECT_TOKEN_INVALID error code
# to the spec only — an omitted field is byte-identical, and the four files
# are byte-identical there as well. The same-day 018cd0f7 follow-up (upstream
# PR #576) added the CONNECT_TOKEN_REQUIRED spec enum entry; the samples are
# unchanged there too.)
commit = "018cd0f7656827a7ff6181c9f4a1d87d759d3e42"
# Protocol version range these samples exercise.
protocol_version_min = 2
protocol_version_max = 3
# ISO 8601 date of the last refresh.
synced = "2026-09-12"

# SHA-256 of each vendored file. A policy test recomputes these, so a sample
# cannot be edited without also updating this marker (keeps provenance honest).
[files]
"v2-client-messages.jsonl" = "929f25d702d3e21f2cca640cd14f9ce044945a6ef9c2c258de56f3f112164227"
"v2-server-messages.jsonl" = "b5aee60d2cbd410c1088da1bbd1142d88d89600bc600f00b2d1849586f1654cd"
"v3-client-messages.jsonl" = "5f6e92f550e7bb0b2ea4be02dea30f5b09677ecf4e01b5451d41d824f405b4cb"
"v3-server-messages.jsonl" = "5d210777ffe3db0ba36b10be6f40f2354acbbe9c5f4b6b83544eafa95daedbd6"
