# Provenance for the vendored Signal Fish server AsyncAPI protocol spec.
#
# Refresh procedure: see .llm/skills/protocol-wire-conformance/SKILL.md
# Update this file IN THE SAME COMMIT as any change to the vendored spec.

[upstream]
repo = "https://github.com/Ambiguous-Interactive/signal-fish-server"
path = "spec"
# Exact server commit the spec bytes were copied from.
# 2026-09-14 refresh: upstream PR #588 (server issue #539) trimmed the
# server-internal `connected_at` join timestamp from every protocol-v3
# snapshot payload — `V3PlayerInfo` drops the field and the shared
# `SpectatorInfo` schema split into version-disjoint V2/V3 shapes (v3 omits
# it; v2 keeps the frozen shape). The client face was reconciled in lockstep:
# decode tolerance shipped in 0.13.0 (`#[serde(default)]`, reads back as an
# empty string), and re-serialization now omits the empty field so the
# semantic round-trip matches the trimmed v3 shape. The v3 server wire
# samples advanced with the same commit; the v2 samples are byte-identical.
# The released runtime compatibility binding in tests/compatibility.toml is
# the Server 0.9.1 release pin
# (24a5d10b9e1700cdbef24f05dfe7fe1f0719ac3d), whose client-observable wire is
# byte-identical to the 0.8.0/0.9.0 releases
# (d79dcdc7549777c8c2bd9fcb2d132641532d8c86) — this evidence authority
# advances together with
# tests/compatibility.toml's [protocol_authority] and the wire-samples
# PROVENANCE.
commit = "e1b65b965390355e9fd15661dc95a8a4321eab17"
# ISO 8601 date of the last refresh.
synced = "2026-09-14"

